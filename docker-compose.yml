services:
  trademaster:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trademaster-app
    restart: unless-stopped
    ports:
      - "5126:5126"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__UsePostgreSql=true
      - ConnectionStrings__TradeMASterDb=Host=postgres;Port=5432;Database=trademaster;Username=trademaster;Password=${POSTGRES_PASSWORD:-change-me}
      - Cache__UseRedis=true
      - ConnectionStrings__Redis=redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ROBINHOOD_MCP_ACCESS_TOKEN=${ROBINHOOD_MCP_ACCESS_TOKEN:-}
    volumes:
      - data_protection_keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: trademaster-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trademaster
      POSTGRES_USER: trademaster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trademaster -d trademaster"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: trademaster-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  data_protection_keys:
